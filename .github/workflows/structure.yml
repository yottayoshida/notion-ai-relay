name: Skill structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python3 -m pip install -r requirements-dev.txt
      - run: sh scripts/check.sh

  shift-jis:
    name: Python 3.12, Shift JIS locale
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Run the checks under ja_JP.SJIS
        env:
          LC_ALL: ja_JP.SJIS
        run: |
          python3 -c 'import codecs, locale, sys; found = [codecs.lookup(name).name for name in (locale.getpreferredencoding(False), sys.stdin.encoding)]; print("encodings:", found); sys.exit(found != ["shift_jis"] * 2)' < /dev/null
          sh scripts/check.sh

name: Support or bug report
description: Something did not work as the documentation says.
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use [private vulnerability reporting](https://github.com/yottayoshida/notion-ai-relay/security/advisories/new) as described in [SECURITY.md](https://github.com/yottayoshida/notion-ai-relay/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The details that the support paragraph of [installation maintenance](https://github.com/yottayoshida/notion-ai-relay/blob/main/docs/install-maintenance.md#5-confirm-reload-and-diagnose-without-secrets) asks for.
    validations:
      required: true
  - type: checkboxes
    id: nothing-private
    attributes:
      label: Nothing private
      options:
        - label: This report contains no tokens, credential stores, business page contents, or complete conversation logs, and usernames and private paths are redacted.
          required: true
